s: 50%; background: var(--bg); border: 2px solid var(--violet); box-shadow: 0 0 8px var(--violet); z-index: 2; transition: all 0.2s; }.tl-item:hover .tl-node { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }.tl-header { margin-bottom: 0.5rem; }.tl-meta { display: flex; align-items: center; gap: 0.6rem; font-family: var(--mono); font-size: 0.65rem; color: var(--dim); margin-bottom: 0.25rem; }.tl-badge { background: var(--rdim); color: var(--red); border: 1px solid rgba(232,41,58,0.2); padding: 0.1rem 0.4rem; font-weight: bold; border-radius: 1px; }.tl-title { font-family: var(--head); font-size: 1.4rem; font-weight: 700; color: #fff; line-height: 1.2; text-transform: uppercase; }.tl-corp { color: var(--blue); font-size: 0.85rem; font-family: var(--mono); margin-top: 0.1rem; }.tl-body { color: var(--dim); font-size: 0.9rem; line-height: 1.6; }.tl-body ul { list-style: none; margin-top: 0.4rem; display: flex; flex-direction: column; gap: 0.3rem; }.tl-body li { position: relative; padding-left: 0.8rem; }.tl-body li::before { content: '›'; position: absolute; left: 0; color: var(--violet); font-weight: bold; }/* Footer Grid Segment */footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 2rem 0; font-family: var(--mono); font-size: 0.65rem; color: var(--dim); }.foot-wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }.foot-left { display: flex; align-items: center; gap: 0.5rem; }.foot-right a { color: var(--dim); text-decoration: none; margin-left: 1rem; }.foot-right a:hover { color: var(--blue); }@media (max-width: 768px) {.nav-links { display: none; }nav { padding: 0 1rem; }.wrap { padding: 0 1rem; }.hero-readout { flex-direction: column; }.readout-cell { border-right: none; border-bottom: 1px solid var(--border); }.readout-cell:last-child { border-bottom: none; }}[JAI RANE]// THREAT ANALYST/home/terminal/arsenal/dossier/operationsSYS_STATUS: ACTIVEPYTHON
